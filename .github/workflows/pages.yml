name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          # Supabase publishable keys are designed for public browser clients.
          # Data access is enforced by the database RLS policies in /supabase.
          VITE_SUPABASE_URL: https://wclrkiqfomrpyzxfdlsr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_E94XEfex6Ad2e5XUEF1OUw_qM6pFZPs
          VITE_EMAIL_CODE_ENABLED: "false"
          VITE_APPLE_AUTH_ENABLED: "false"
          VITE_PREMIUM_USERNAME_ENABLED: "false"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
