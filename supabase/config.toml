project_id = "moon-irl"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "https://cinderella2026.github.io/Moon_irl/**"
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600

[functions.delete-account]
verify_jwt = true

[functions.create-username-invoice]
verify_jwt = true

# Telegram calls this endpoint directly, so the function verifies Telegram's
# secret header instead of expecting a Supabase user JWT.
[functions.telegram-payment-webhook]
verify_jwt = false
